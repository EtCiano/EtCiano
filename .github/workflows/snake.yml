name: Generate Snake Animation

on:
  schedule:
    # roda todo dia à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main  # ajuste para "master" se for o nome da sua branch principal

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: EtCiano
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}